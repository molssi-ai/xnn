[build-system]
requires = ["setuptools>=77"]   # >=77 for the SPDX license field (PEP 639)
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI is "xnns" (the name "xnn" is taken there); the
# import package and the CLI are "xnn":  pip install xnns  ->  import xnn
name = "xnns"
dynamic = ["version"]          # single source: xnn.__version__ (src/xnn/__init__.py)
description = "Machine-learning interatomic potentials in PyTorch for molecular and periodic systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]    # the SEAMM BSD-3 notice ships inside xnn/ffnn/data/
authors = [
    { name = "Mohammad Mostafanejad", email = "smostafanejad@molssi.org" },
]
maintainers = [
    { name = "MolSSI AI", email = "smostafanejad@molssi.org" },
]
keywords = [
    "interatomic potentials", "machine learning", "molecular dynamics",
    "MACE", "NequIP", "Allegro", "SchNet", "PhysNet", "ANI", "ReaxFF", "OPLS",
    "pytorch", "LAMMPS", "ASE",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]
# HDF5 reader for the ANI-1 dataset hub builder (pyanitools .h5 files).
hub = ["h5py>=3.0"]
# NOTE: relaxed from >=0.5 -- the example notebooks compare against ACEsuit/mace
# (mace-torch), which pins e3nn==0.4.4. xnn runs fine on 0.4.4 (all tests pass).
gnn = ["e3nn>=0.4.4"]          # for NequIP / MACE / Allegro
# MolSSI Driver Interface engine (xnn mdi); MPI method also needs mpi4py.
mdi = ["pymdi>=1.4"]
# Cell-list neighbor lists. Optional -- the built-in reference implementation is
# used without it -- but that one is quadratic, so this is what makes anything
# past a few hundred atoms practical. See common/data/neighborlist.py.
vesin = ["vesin-torch>=0.3"]
hydra = ["hydra-core>=1.3", "omegaconf>=2.3"]
dev = ["pytest"]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-togglebutton",    # collapsible long notebook outputs
    "myst-nb>=1.1",            # renders the executed example notebooks
]
# Everything needed to build and run the example notebooks in examples/gnn/,
# including the reference ACEsuit/mace and mir-group/nequip implementations the
# notebooks are benchmarked against. The Allegro reference (mir-group/allegro
# v0.3.0) is not on PyPI, and PyPI refuses metadata with direct URL
# requirements, so install it separately for the Allegro fidelity notebook:
#     pip install "git+https://github.com/mir-group/allegro@v0.3.0"
examples = [
    "ase>=3.22",
    "e3nn>=0.4.4",
    "h5py>=3.0",
    "mace-torch==0.3.16",
    "nequip==0.6.2",
    "matplotlib>=3.8",
    "jupyter",
    "ipykernel",
    "nbconvert",
    "nbformat",
    "openmm>=8.0",
    "rdkit>=2023.9",
]
# The ANI-1 fidelity notebook and parity test compare against aiqm/torchani.
ani = ["torchani==2.2.4", "h5py>=3.0"]
# The DFT-D4 fidelity notebook and parity tests compare against the reference
# dftd4 Python package (used only as an external oracle). tomli is what
# its parameter loader wants on Python >= 3.11.
d4 = ["dftd4>=3.7", "tomli"]
# The DFT-D3 fidelity notebook and parity tests compare against simple-dftd3's
# Python package (used only as an external oracle).
d3 = ["dftd3>=1.0"]
# The OPLS fidelity notebook and parity test compare against OpenMM.
# classical force fields: RDKit assigns atom types from the SMARTS templates
# in .frc force-field files
ffnn = ["rdkit>=2023.9"]
opls = ["openmm>=8.0", "rdkit>=2023.9"]
all = [
    "ase>=3.22",
    "e3nn>=0.4.4",
    "vesin-torch>=0.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pytest",
    "mace-torch==0.3.16",
    "nequip==0.6.2",
    "matplotlib>=3.8",
    "jupyter",
    "ipykernel",
    "nbconvert",
    "nbformat",
]

[project.urls]
Homepage = "https://github.com/molssi-ai/xnn"
Documentation = "https://molssi-ai.github.io/xnn/"
Source = "https://github.com/molssi-ai/xnn"
Issues = "https://github.com/molssi-ai/xnn/issues"
Changelog = "https://github.com/molssi-ai/xnn/releases"

[project.scripts]
xnn = "xnn.common.cli:main"

[tool.setuptools.dynamic]
version = { attr = "xnn.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Grimme D3 / D4 reference data (numerical tables extracted from the dftd4 and
# simple-dftd3 sources by tools/build_d*_reference.py) and the PhysNet-era D3 tables
"xnn.common.models" = ["*.npz"]
# force-field parameter files in the SEAMM .frc format (OPLS-AA, ReaxFF ...)
"xnn.ffnn" = ["data/*.frc", "data/reaxff/*.frc", "data/*.md", "data/LICENSE-*"]

# ---------------------------------------------------------------------------
# uv configuration -- reproduces the .venv the notebooks were created with.
#
# The host has 2x A100 with CUDA driver 12.2, so torch must use the cu121 GPU
# wheels (the default wheels are cu13x and fail on this driver). torch is pulled
# from the PyTorch cu121 index, which resolves torch to 2.5.1+cu121.
# ---------------------------------------------------------------------------
[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
