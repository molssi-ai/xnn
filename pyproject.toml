[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xnns"
version = "0.1.0"
description = "Machine-learning interatomic potentials in PyTorch for molecular and periodic systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]
# HDF5 reader for the ANI-1 dataset hub builder (pyanitools .h5 files).
hub = ["h5py>=3.0"]
# NOTE: relaxed from >=0.5 -- the example notebooks compare against ACEsuit/mace
# (mace-torch), which pins e3nn==0.4.4. xnns runs fine on 0.4.4 (all tests pass).
gnn = ["e3nn>=0.4.4"]          # for NequIP / MACE / Allegro
# MolSSI Driver Interface engine (xnns mdi); MPI method also needs mpi4py.
mdi = ["pymdi>=1.4"]
# Cell-list neighbor lists. Optional -- the built-in reference implementation is
# used without it -- but that one is quadratic, so this is what makes anything
# past a few hundred atoms practical. See common/data/neighborlist.py.
vesin = ["vesin-torch>=0.3"]
hydra = ["hydra-core>=1.3", "omegaconf>=2.3"]
dev = ["pytest"]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-togglebutton",    # collapsible long notebook outputs
    "myst-nb>=1.1",            # renders the executed example notebooks
]
# Everything needed to build and run the example notebooks in examples/gnn/,
# including the reference ACEsuit/mace and mir-group/nequip implementations the
# notebooks are benchmarked against.
examples = [
    "ase>=3.22",
    "e3nn>=0.4.4",
    "h5py>=3.0",
    "mace-torch==0.3.16",
    "nequip==0.6.2",
    "nequip-allegro @ git+https://github.com/mir-group/allegro@v0.3.0",
    "matplotlib>=3.8",
    "jupyter",
    "ipykernel",
    "nbconvert",
    "nbformat",
    "openmm>=8.0",
]
# The ANI-1 fidelity notebook and parity test compare against aiqm/torchani.
ani = ["torchani==2.2.4", "h5py>=3.0"]
# The OPLS fidelity notebook and parity test compare against OpenMM.
opls = ["openmm>=8.0"]
all = [
    "ase>=3.22",
    "e3nn>=0.4.4",
    "vesin-torch>=0.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pytest",
    "mace-torch==0.3.16",
    "nequip==0.6.2",
    "nequip-allegro @ git+https://github.com/mir-group/allegro@v0.3.0",
    "matplotlib>=3.8",
    "jupyter",
    "ipykernel",
    "nbconvert",
    "nbformat",
]

[project.scripts]
xnns = "xnns.common.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xnns.dnn.models" = ["*.npz"]   # Grimme D3 reference tables (PhysNet)

# ---------------------------------------------------------------------------
# uv configuration -- reproduces the .venv the notebooks were created with.
#
# The host has 2x A100 with CUDA driver 12.2, so torch must use the cu121 GPU
# wheels (the default wheels are cu13x and fail on this driver). torch is pulled
# from the PyTorch cu121 index, which resolves torch to 2.5.1+cu121.
# ---------------------------------------------------------------------------
[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
