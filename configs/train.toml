# Same schema as the YAML configs; loaded via xnns.common.config.from_toml(...)
device = "auto"
seed = 0
output_dir = "runs/exp"

[model]
name = "schnet"
cutoff = 5.0
n_features = 128
n_interactions = 3
n_rbf = 50

[data]
train_path = "data/train.extxyz"
batch_size = 16
val_fraction = 0.1

[optim]
lr = 1e-3
epochs = 100
energy_weight = 1.0
force_weight = 10.0
scheduler = "cosine"
