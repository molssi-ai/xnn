# NewtonNet (Haghighatlari et al., Digital Discovery 2022): every option at its default;
# the paper's model is the commented block at the end.
name: newtonnet
cutoff: 5.0
n_features: 128
n_interactions: 3
n_rbf: 20
extra:
  activation: silu                # nonlinearity of every network
  radial_basis: bessel            # bessel / gaussian / expnorm / smooth_bessel
  rbf_prefactor: null             # Bessel normalization; null = sin(n pi x) / x with x = r / cutoff
  trainable_rbf: false            # learn the basis parameters
  cutoff_function: polynomial     # polynomial / cosine
  num_polynomial_cutoff: 9        # degree of the polynomial envelope
  rbf_bias: false                 # bias in the radial layer
  latent_force: false             # force magnitudes and latent forces (eq 8-10)
  displacement: false             # displacement features and energy change (eq 13-16)
  layer_norm: false               # normalize the features after every block
  readout_widths: null            # hidden widths of the energy network; null = [n_features, n_features]
  direct_forces: false            # forces from the force features instead of the energy gradient
  weight_init: torch              # torch / xavier_uniform / xavier_normal / glorot_orthogonal / he_orthogonal
  energy_shift: 0.0               # per-atom energy standardization
  energy_scale: 1.0
  species: null                   # e.g. [1, 6, 8]
  atomic_energies: null           # per-element reference energies, or average / estimated

