# ByteFF-Pol (Zheng et al., Nat. Commun. 17, 8276 (2026)): the ByteFF graph
# transformer predicts a polarizable force field: bonded terms, Born-Mayer
# repulsion, damped C6 dispersion, point charges, Thole-damped induced dipoles
# and charge transfer. The released ByteFF-Pol-25 network loads with
# ByteFFPol.from_foundation(); molecules and clusters, no cell.
name: byteff_pol
cutoff: 0.1              # neighbor-list radius of the data pipeline; the model forms all atom pairs itself
structure: null          # SMILES (or list of SMILES) of the system to bind
members: 1               # ensemble networks whose parameters are averaged
supported_elements: [1, 3, 6, 7, 8, 9, 15, 16, 17]
coulomb_constant: 332.0637141491396   # kcal Angstrom / (mol e^2)
charge14: 0.5            # 1-4 electrostatics scale
vdw14: 0.5               # 1-4 repulsion and dispersion scale
induction14: 0.5         # 1-4 scale of the charges' polarizing field (1-2, 1-3: none)
induction15: 1.0         # 1-5 scale of the charges' polarizing field
thole: 0.39              # Thole damping strength
dispersion_damping: 120.0  # s of -C6 / (s r0^6 + r^6)
wall: 1.5                # s12 of the (s12 / r)^12 wall, Angstrom (kcal/mol)^(1/12)
repulsion_prefactor: 6.0 # a of a eps exp[lam (1 - r / r0)]
charge: 0                # total charge, for bond perception from coordinates
use_fast: auto           # compiled energy block on CUDA: auto (after 1000 calls of one shape), true, false
graph:                   # graph transformer, as for ByteFF
  atom_dim: 32
  feature_dim: 8
  node_mlp: [64, 256, 2]
  edge_mlp: [64, 256, 2]
  hidden: 256
  layers: 4
  heads: 16
  head_dim: 16
  ffn: [256, 2]
  out_dim: 256
  jumping_knowledge: cat
  activation: gelu
  scale_by_degree: false
bonded:
  pre: [256, 256, 3]
  out: [256, 4]
  tanh_output: 20.0
  form: two_well         # two force constants about fixed anchors
  activation: gelu
nonbonded:               # charges, effective volumes and pair parameters
  pre: [256, 256, 3]     # bond charge increment MLP (hidden, out, layers)
  out: [256, 3]          # output MLPs (hidden, layers)
  charge_bound: 4.0      # bound of the bond charge increments
  lithium_volume: 13.0   # fixed effective volume of Li (Angstrom^3)
  lithium_alpha: 1.0e-6  # fixed polarizability of Li (null: predicted)
  lithium_damping: 0.2   # lower bound of Li's damping volume
  damping_floor: 1.0e-6  # lower bound of every damping volume
  lambda_scale: 5.0      # scale of the repulsion exponents
  c6_scale: 1000.0       # storage scale of the free-atom C6 table
  activation: gelu
# Paper values (Methods): s_rep = 1.5, s_disp = 120, Lorentz-Berthelot combination.
