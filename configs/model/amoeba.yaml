name: amoeba
cutoff: 12.0                    # neighbor-list cutoff in A (a molecule interacts in full within it: enclose the whole cluster for gas-phase work)
library: amoeba-water-2003      # parameter library: amoeba-water-2003, amoebapro13, a .frc path (file.frc:variant), a Tinker .prm, or a native JSON path
topology: null                  # topology JSON written by MolecularTopology.save
tinker_xyz: null                # or a Tinker .xyz file carrying the atom types and connectivity
types: null                     # or per-atom type names of the library ...
bonds: null                     # ... with the bond index pairs, e.g. [[0, 1], [0, 2]]
polarization: null              # null = the library's setting; mutual (self-consistent induced dipoles), direct, or none
trainable: []                   # parameter groups to refit, e.g. [vdw, torsion, polarizability, charge, dipole, quadrupole]; "all" for every group
conserve_charge: true           # hold every molecule's total charge while "charge" trains
symmetry_mask: true             # multipole components the library leaves zero stay zero while they train
# periodic cells: Ewald sums with particle-mesh reciprocal space (on by default when a cell is
# present); the defaults follow Tinker (coefficient from the real-space cutoff, 1.2 mesh points
# per Angstrom rounded up to an FFT-friendly size, B-spline order 5)
ewald: null                     # null = on for cells, false = truncate at the cutoff
ewald_cutoff: null              # real-space cutoff in A (default min(7, cutoff))
ewald_alpha: null               # Ewald coefficient of the multipoles (1/A); default from ewald_cutoff
pewald_alpha: null              # ... of the induction (default ewald_alpha)
pme_grid: null                  # mesh dimensions, e.g. [24, 24, 24]
pme_order: 5
vdw_cutoff: null                # switched short-range terms: cutoff (default the neighbor cutoff) ...
vdw_taper: null                 # ... and the start of the switch (default 0.9 x cutoff for cells)
taper: null                     # start of the switch of every switched term
polar_eps: 1.0e-8               # convergence of the iterative induced-dipole solve, rms change in Debye
mesh_self: false                # true removes the position-averaged mesh self-interaction from the mesh sums (plain smooth PME by default)
solver: auto                    # auto (dense for molecules up to 1000 atoms), dense, iterative
predictor: null                 # aspc, gear or previous: predict the starting dipoles from the last steps (MD)
preconditioner: diagonal        # diagonal, block, neumann or block-neumann (fewer iterations, rarely a faster step)
use_fast: false                 # true or auto: fused GPU kernels for the pair terms (evaluation only)
# AMOEBA: anharmonic bonds and angles, stretch-bend, out-of-plane bends, Fourier and
# pi-torsions, torsion-torsion maps, buffered 14-7 van der Waals, permanent atomic
# multipoles in local frames and Thole-damped mutual induction (Ren and Ponder 2003,
# Ponder et al. 2010, Shi et al. 2013). Amoeba.from_atoms types a structure from the
# library's templates and residue fragments.
