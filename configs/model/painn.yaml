# PaiNN (Schuett, Unke & Gastegger, ICML 2021): every option at its default;
# the paper's model is the commented block at the end.
name: painn
cutoff: 5.0
n_features: 128
n_interactions: 3
n_rbf: 20
extra:
  radial_basis: gaussian          # gaussian / bessel / expnorm
  trainable_rbf: false            # learn the basis parameters
  shared_filters: false           # the same filters for every block
  shared_interactions: false      # one set of message and update networks
  epsilon: 1.0e-8                 # stabilizer of the vector norm
  dipole: false                   # dipole head (latent charges, eq 12)
  atomic_dipoles: false           # with atomic dipoles (eq 13)
  correct_charges: true           # latent charges sum to the net charge
  polarizability: false           # polarizability head (eq 14)
  n_output_blocks: 2              # layers per output head
  scalar_product: true            # Table IV ablations
  vector_propagation: true
  vector_features: true
  weight_init: xavier_uniform     # xavier_uniform / xavier_normal / glorot_orthogonal / he_orthogonal / torch
  energy_shift: 0.0               # per-atom energy standardization
  energy_scale: 1.0
  species: null                   # e.g. [1, 6, 8]
  atomic_energies: null           # per-element reference energies, or average / estimated

# The paper's model:
#   extra:
#     radial_basis: bessel
#     atomic_dipoles: true        # with dipole: true
