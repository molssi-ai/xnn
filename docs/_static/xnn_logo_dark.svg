<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 220 64">
  <!-- small graph motif: nodes + edges -->
  <g stroke="#ed1c24" stroke-width="2" fill="none">
    <line x1="14" y1="44" x2="32" y2="20"/>
    <line x1="32" y1="20" x2="52" y2="40"/>
    <line x1="14" y1="44" x2="52" y2="40"/>
    <line x1="32" y1="20" x2="44" y2="8"/>
  </g>
  <g fill="#ed1c24">
    <circle cx="14" cy="44" r="5"/>
    <circle cx="52" cy="40" r="5"/>
    <circle cx="44" cy="8" r="4"/>
  </g>
  <circle cx="32" cy="20" r="6" fill="#ffffff"/>
  <!-- wordmark -->
  <text x="68" y="42" font-family="Helvetica, Arial, sans-serif" font-size="34"
        font-weight="700" fill="#ffffff">xnn</text>
  <text x="68" y="58" font-family="Helvetica, Arial, sans-serif" font-size="11"
