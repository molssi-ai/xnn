# Dependabot: keep the uv lockfile and the workflow actions current.
# Security advisories open pull requests as soon as they are published;
# routine version updates are grouped into one weekly pull request each,
# opened against the dev branch.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
    # torch is pinned to the CUDA build the GPU environments use (cu126, which
    # ends at 2.14.1, the last release with Python 3.11 wheels) and is bumped
    # by hand together with the e3nn / mace-torch reference versions and the
    # torch matrix of the Tests workflow; installs from PyPI resolve a current
    # torch (torch>=2.0).
    # e3nn is held at the version mace-torch pins, and nequip / nequip-allegro
    # at the reference versions the NequIP and Allegro comparisons use; newer
    # releases need a newer e3nn and cannot be resolved together with mace-torch.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "e3nn"
      - dependency-name: "nequip"
      - dependency-name: "nequip-allegro"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
