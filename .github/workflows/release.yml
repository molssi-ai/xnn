name: Release

# Builds the sdist and wheel of the "xnns" distribution (import name "xnn")
# and publishes them with PyPI Trusted Publishing (OIDC, no API tokens).
#
#   * git push origin vX.Y.Z  ->  build, verify that the tag matches
#     xnn.__version__, upload to PyPI, then create the GitHub Release for the
#     tag with the files attached (nothing but git is needed on your side).
#   * "Run workflow" (workflow_dispatch):
#       target=testpypi  ->  the same build, uploaded to TestPyPI (rehearsal;
#                            any branch or tag)
#       target=pypi      ->  publish an already pushed tag: pick the tag under
#                            "Use workflow from", it must equal v<version>
#       target=none      ->  build and check only
#
# One-time setup (see docs/developer_guide/releasing.rst):
#   - PyPI     -> pending trusted publisher for project "xnns", this repo,
#                 workflow "release.yml", environment "pypi"
#   - TestPyPI -> the same with environment "testpypi"
#   - GitHub   -> Settings > Environments: create "pypi" and "testpypi"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish the build
        type: choice
        options: [testpypi, pypi, none]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Read the package version
        id: version
        run: |
          VERSION=$(python - <<'EOF'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("src/xnn/__init__.py").read_text())
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                      getattr(t, "id", None) == "__version__" for t in node.targets):
                  print(ast.literal_eval(node.value)); break
          EOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "xnn.__version__ = $VERSION"

      - name: Check that the tag matches the version
        # a PyPI upload must come from a tag vX.Y.Z equal to xnn.__version__
        if: github.event_name == 'push' || inputs.target == 'pypi'
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::publishing to PyPI needs a tag; run this from a tag ref, not '$TAG'"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' does not match xnn.__version__ 'v$VERSION'"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check the distributions
        run: |
          twine check --strict dist/*
          ls -l dist
          # the data files every install needs must be inside the wheel
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = ["xnn/ffnn/data/oplsaa.frc", "xnn/ffnn/data/reaxff/CHO_cho_2008.frc",
                  "xnn/ffnn/data/LICENSE-SEAMM",
                  "xnn/common/models/d3_reference.npz", "xnn/common/models/d4_reference.npz"]
          missing = [n for n in need if n not in names]
          assert not missing, f"missing from wheel: {missing}"
          print(f"{wheel}: {len(names)} files, data files present")
          EOF

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet --upgrade pip
          /tmp/smoke/bin/pip install --quiet "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import xnn; print('xnn', xnn.__version__)"
          /tmp/smoke/bin/python -c "from xnn.ffnn.common import read_forcefield; ff = read_forcefield('oplsaa'); print('oplsaa types:', len(ff.templates))"
          /tmp/smoke/bin/xnn 2>&1 | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xnns
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xnns
    permissions:
      id-token: write
      contents: write        # to create the GitHub Release and attach the files
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
      - name: Create the GitHub Release for the tag (or attach to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "xnn $VERSION" --generate-notes
          fi
