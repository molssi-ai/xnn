name: Tests

# Runs the test suite on CPU with coverage and uploads the coverage report and
# the JUnit test results to Codecov (coverage graphs and test analytics).
# GPU-only tests (fast paths, Triton kernels) skip themselves without CUDA; the
# Triton kernels also run on CPU tensors under Triton's interpreter.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # the oldest supported torch and the current one, each with the Triton
    # release its interpreter runs the kernels with; Codecov gets the current one
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch: "2.5.1"
            triton: "3.3.1"
            upload: false
          - torch: "2.14.1"
            triton: "3.8.0"
            upload: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch
        run: pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install Triton for its interpreter
        # the CPU wheel of torch comes without Triton; its interpreter runs the
        # fused kernels of the fast paths on CPU tensors in the tests (at least
        # 3.3: the 3.1 interpreter crashes in its atomic adds)
        run: pip install "triton==${{ matrix.triton }}"

      - name: Install xnn and test dependencies
        # cpu-kernels: ninja, which builds the C++ CPU kernels of the HDNNP tests
        run: pip install -e ".[ase,gnn,ffnn,vesin,cpu-kernels,dev]" "e3nn==0.4.4" pytest-cov

      - name: Fetch the MOPAC parameter files of the sqmnn methods
        # xnn does not ship the published PM3/PM6/PM6-ORG/PM7 values; they are
        # downloaded from the pinned MOPAC release (MD5-checked) into the model
        # cache here, the only network access of the run, so the tests below
        # can run with XNN_OFFLINE
        run: >
          python -c "from xnn.sqmnn.common.published import published_parameters as p;
          [p(m) for m in ('pm3', 'pm6', 'pm6-org', 'pm7')]"

      - name: Run the tests with coverage
        env:
          XNN_OFFLINE: "1"
        # junit.xml (legacy family, the schema Codecov Test Analytics reads)
        # feeds the per-test insights: flaky tests, slowest tests, failure rates
        run: >
          pytest -q -rfEs --cov=xnn --cov-report=
          --junitxml=junit.xml -o junit_family=legacy

      - name: Run the compiled CPU paths again without the compiler
        if: ${{ !cancelled() }}
        env:
          XNN_OFFLINE: "1"
          TORCHDYNAMO_DISABLE: "1"
        # the functions torch.compile runs are read by the compiler, not run line
        # by line, so coverage misses them; this pass runs them as plain Python
        # (the run above checks the compiled code) and adds to the same report
        run: >
          pytest -q -rfEs --cov=xnn --cov-append --cov-report=xml
          --cov-report=term-missing:skip-covered
          tests/test_dispersion_fast.py tests/test_hdnnp.py tests/test_compiled_blocks.py

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.upload }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: molssi-ai/xnn
          files: coverage.xml
          # a failed upload fails the job, so a missing or wrong token is
          # visible in the run instead of only as an empty dashboard
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.upload }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: molssi-ai/xnn
          files: junit.xml
          fail_ci_if_error: true
